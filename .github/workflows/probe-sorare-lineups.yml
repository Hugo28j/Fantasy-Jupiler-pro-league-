name: Probe Sorare lineups

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/probe-sorare-lineups.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect substitution-related Sorare schema
        shell: python
        run: |
          import urllib.request,re
          req=urllib.request.Request("https://api.sorare.com/graphql/schema",headers={"User-Agent":"Fantasy-JPL/1.0"})
          with urllib.request.urlopen(req,timeout=60) as r:
              schema=r.read().decode("utf-8",errors="replace")

          def block(marker):
              i=schema.find(marker)
              print("\n===",marker,"===")
              if i<0:
                  print("NOT_FOUND"); return
              j=schema.find("\ntype ",i+5)
              k=schema.find("\nenum ",i+5)
              ends=[x for x in [j,k] if x>i]
              end=min(ends) if ends else min(len(schema),i+20000)
              print(schema[i:end][:20000])

          block("enum PlayerFieldStatus")
          block("enum TeamFormation")
          block("type PlayerGameStats ")
          print("\n=== PLAYER GAME STAT SUB LINES ===")
          i=schema.find("type PlayerGameStats ")
          j=schema.find("\ntype ",i+5)
          for line in schema[i:j].splitlines():
              if any(k in line.lower() for k in ["sub","fieldstatus","formation","started","minute","sheet"]):
                  print(line)
