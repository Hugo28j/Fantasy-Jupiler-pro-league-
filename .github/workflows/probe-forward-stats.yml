name: Probe Sorare forward stats

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/probe-forward-stats.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect attacker-related PlayerGameStats fields
        shell: python
        run: |
          import urllib.request
          req=urllib.request.Request("https://api.sorare.com/graphql/schema",headers={"User-Agent":"Fantasy-JPL/1.0"})
          with urllib.request.urlopen(req,timeout=60) as r:
              schema=r.read().decode("utf-8",errors="replace")
          i=schema.find("type PlayerGameStats ")
          if i<0: i=schema.find("type PlayerGameStats {")
          j=schema.find("\ntype ",i+5)
          block=schema[i:j]
          keywords=["assist","chance","shot","scoring","contest","pass","cross","box","penalty","offside","goal","possession","touch","att"]
          for line in block.splitlines():
              low=line.lower()
              if any(k in low for k in keywords):
                  print(line)
