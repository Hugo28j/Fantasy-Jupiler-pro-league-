name: Test Sorare football API

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-sorare-api.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Query smaller Sorare football calls
        shell: python
        run: |
          import json, urllib.request, urllib.error

          GRAPHQL = "https://api.sorare.com/graphql"

          def gql(name, query):
              print(f"\n=== {name} ===")
              payload=json.dumps({"query":query}).encode()
              req=urllib.request.Request(GRAPHQL,data=payload,headers={
                  "content-type":"application/json",
                  "User-Agent":"Fantasy-JPL/1.0"
              },method="POST")
              try:
                  with urllib.request.urlopen(req,timeout=60) as r:
                      raw=r.read().decode("utf-8")
                      print("HTTP",r.status)
              except urllib.error.HTTPError as e:
                  raw=e.read().decode("utf-8",errors="replace")
                  print("HTTP",e.code)
              print(raw[:40000])

          gql("CLUB_BRUGGE_PLAYERS", """
          query {
            football {
              club(slug: "club-brugge") {
                id
                name
                slug
                domesticLeague {
                  id
                  name
                  slug
                  openForGameStats
                }
                activePlayers(first: 50) {
                  nodes {
                    id
                    slug
                    displayName
                    optaId
                  }
                }
              }
            }
          }
          """)

          gql("HANS_STATS", """
          query {
            anyPlayer(slug: "hans-vanaken") {
              ... on Player {
                id
                slug
                displayName
                activeClub {
                  id
                  name
                  slug
                }
                gameStats(last: 5) {
                  id
                  minsPlayed
                  saves
                  savedIbox
                  punches
                  cleanSheet
                  goalsConceded
                  fouls
                  wasFouled
                  yellowCard
                  redCard
                  goals
                  goalAssist
                  wonTackle
                  duelWon
                  duelLost
                  totalClearance
                  interceptionWon
                  possWon
                  possLostCtrl
                  accuratePass
                  accurateLongBalls
                  missedPass
                  wonContest
                  ontargetScoringAtt
                  footballGame {
                    id
                    date
                    statusTyped
                    homeScore
                    awayScore
                  }
                }
              }
            }
          }
          """)
