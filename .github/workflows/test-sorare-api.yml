name: Check Sorare sync

on:
  workflow_dispatch:
  push:
    paths:
      - "supabase/functions/sync-jpl/index.ts"
      - ".github/workflows/test-sorare-api.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Sorare fixture schema
        shell: python
        run: |
          import urllib.request
          url="https://api.sorare.com/graphql/schema"
          req=urllib.request.Request(url,headers={"User-Agent":"Fantasy-JPL/1.0"})
          with urllib.request.urlopen(req,timeout=60) as r:
              schema=r.read().decode("utf-8",errors="replace")
          def block(name):
              marker=f"type {name} "
              i=schema.find(marker)
              if i<0:
                  marker=f"type {name} {{"
                  i=schema.find(marker)
              print(f"\n=== {name} ===")
              if i<0:
                  print("NOT_FOUND")
                  return
              j=schema.find("\ntype ",i+5)
              if j<0: j=min(len(schema),i+22000)
              print(schema[i:j][:22000])
          for name in ["So5Fixture","GameWeek","Game","PlayerGameStats"]:
              block(name)
