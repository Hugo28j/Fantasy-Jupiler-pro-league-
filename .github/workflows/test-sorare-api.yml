name: Test Sorare football API

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-sorare-api.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Query Club Brugge and player stats
        shell: python
        run: |
          import json, urllib.request, urllib.error

          GRAPHQL = "https://api.sorare.com/graphql"

          def gql(name, query):
              print(f"\n=== {name} ===")
              payload=json.dumps({"query":query}).encode()
              req=urllib.request.Request(GRAPHQL,data=payload,headers={
                  "content-type":"application/json",
                  "User-Agent":"Fantasy-JPL/1.0"
              },method="POST")
              try:
                  with urllib.request.urlopen(req,timeout=60) as r:
                      raw=r.read().decode("utf-8")
                      print("HTTP",r.status)
              except urllib.error.HTTPError as e:
                  raw=e.read().decode("utf-8",errors="replace")
                  print("HTTP",e.code)
              print(raw[:40000])

          gql("SEARCH_HANS", """
          query {
            searchPlayers(query: "Hans Vanaken", page: 1, pageSize: 10) {
              nbHits
              hitIds
            }
          }
          """)

          gql("CLUB_BRUGGE", """
          query {
            football {
              club(slug: "club-brugge") {
                id
                name
                slug
                domesticLeague {
                  id
                  name
                  slug
                  displayName
                  openForGameStats
                }
                activePlayers(first: 8) {
                  nodes {
                    id
                    slug
                    displayName
                    optaId
                    gameStats(last: 2) {
                      id
                      minsPlayed
                      saves
                      savedIbox
                      punches
                      cleanSheet
                      goalsConceded
                      fouls
                      wasFouled
                      yellowCard
                      redCard
                      goals
                      goalAssist
                      wonTackle
                      duelWon
                      duelLost
                      totalClearance
                      interceptionWon
                      possWon
                      possLostCtrl
                      accuratePass
                      accurateLongBalls
                      missedPass
                      wonContest
                      ontargetScoringAtt
                      footballGame {
                        id
                        date
                        statusTyped
                        homeScore
                        awayScore
                        competition {
                          id
                          name
                          slug
                        }
                      }
                    }
                  }
                }
              }
            }
          }
          """)
