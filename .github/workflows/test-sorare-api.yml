name: Check Sorare sync

on:
  workflow_dispatch:
  push:
    paths:
      - "supabase/functions/sync-jpl/index.ts"
      - ".github/workflows/test-sorare-api.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Edge Function
        run: deno check supabase/functions/sync-jpl/index.ts
