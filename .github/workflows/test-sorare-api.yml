name: Test Sorare football API

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-sorare-api.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Sorare football schema
        shell: python
        run: |
          import re, urllib.request

          SCHEMA = "https://api.sorare.com/graphql/schema"
          req = urllib.request.Request(SCHEMA, headers={"User-Agent": "Fantasy-JPL/1.0"})
          with urllib.request.urlopen(req, timeout=60) as r:
              schema = r.read().decode("utf-8", errors="replace")
          print("SCHEMA_BYTES", len(schema))

          def block(type_name):
              marker = f"type {type_name} "
              i = schema.find(marker)
              if i < 0:
                  marker = f"type {type_name}{{"
                  i = schema.find(marker)
              if i < 0:
                  marker = f"type {type_name} {{"
                  i = schema.find(marker)
              if i < 0:
                  print(f"\n=== {type_name}: NOT FOUND ===")
                  return ""
              j = schema.find("\ntype ", i + 5)
              if j < 0: j = min(len(schema), i + 30000)
              b = schema[i:j]
              print(f"\n=== {type_name} ===")
              print(b[:30000])
              return b

          q = block("Query")
          print("\n=== RELEVANT QUERY LINES ===")
          for line in q.splitlines():
              low=line.lower()
              if any(k in low for k in ["club", "player", "competition", "game", "football"]):
                  print(line)

          for t in ["PlayerGameStats","Player","Club","Competition","Game","Membership","Season"]:
              block(t)
