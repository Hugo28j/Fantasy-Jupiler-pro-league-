name: Check Sorare sync

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-sorare-api.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Solve official-like JPL rounds from Sorare schedule
        shell: bash
        run: |
          python -m pip install --quiet ortools
          python <<'PY'
          import json, urllib.request, datetime
          from collections import defaultdict
          from ortools.sat.python import cp_model

          URL="https://api.sorare.com/graphql"
          COMP="jupiler-pro-league"
          START=datetime.datetime(2026,7,1,tzinfo=datetime.timezone.utc)
          END=datetime.datetime(2027,7,1,tzinfo=datetime.timezone.utc)

          def gql(q,variables=None):
              req=urllib.request.Request(
                  URL,
                  data=json.dumps({"query":q,"variables":variables or {}}).encode(),
                  headers={"content-type":"application/json","User-Agent":"Fantasy-JPL/1.0"},
                  method="POST"
              )
              with urllib.request.urlopen(req,timeout=60) as r:
                  body=json.loads(r.read().decode())
              if body.get("errors"): raise RuntimeError(body["errors"])
              return body["data"]

          def fetch(field):
              out=[]; after=None
              for _ in range(20):
                  q=f"""
                  query Games($after:String) {{
                    football {{
                      competition(slug:"{COMP}") {{
                        {field}(first:35,after:$after) {{
                          nodes {{
                            id date
                            homeTeam {{ __typename ... on Club {{ id name slug }} }}
                            awayTeam {{ __typename ... on Club {{ id name slug }} }}
                          }}
                          pageInfo {{ hasNextPage endCursor }}
                        }}
                      }}
                    }}
                  }}
                  """
                  d=gql(q,{"after":after})
                  c=d["football"]["competition"][field]
                  out.extend(c["nodes"])
                  if not c["pageInfo"]["hasNextPage"]: break
                  after=c["pageInfo"]["endCursor"]
              return out

          games={}
          for g in fetch("pastGames")+fetch("futureGames"):
              dt=datetime.datetime.fromisoformat(g["date"].replace("Z","+00:00"))
              if START <= dt < END:
                  games[g["id"]]=g
          games=list(games.values())
          games.sort(key=lambda g:g["date"])
          print("GAMES",len(games))
          assert len(games)==306

          teams=sorted({g["homeTeam"]["id"] for g in games}|{g["awayTeam"]["id"] for g in games})
          print("TEAMS",len(teams))
          assert len(teams)==18

          incident=defaultdict(list)
          for i,g in enumerate(games):
              incident[g["homeTeam"]["id"]].append(i)
              incident[g["awayTeam"]["id"]].append(i)

          ord_by_team_game={}
          for t,idxs in incident.items():
              idxs.sort(key=lambda i:games[i]["date"])
              assert len(idxs)==34
              for pos,i in enumerate(idxs,1):
                  ord_by_team_game[(t,i)]=pos

          model=cp_model.CpModel()
          x={}
          for i,g in enumerate(games):
              oh=ord_by_team_game[(g["homeTeam"]["id"],i)]
              oa=ord_by_team_game[(g["awayTeam"]["id"],i)]
              center=round((oh+oa)/2)
              lo=max(1,min(oh,oa)-8)
              hi=min(34,max(oh,oa)+8)
              # Broad enough to handle postponed games while keeping model compact.
              for r in range(lo,hi+1):
                  x[(i,r)]=model.NewBoolVar(f"x_{i}_{r}")
              model.Add(sum(x[(i,r)] for r in range(lo,hi+1))==1)

          for t,idxs in incident.items():
              for r in range(1,35):
                  vars_here=[x[(i,r)] for i in idxs if (i,r) in x]
                  if not vars_here:
                      raise RuntimeError(f"No candidates for team {t} round {r}")
                  model.Add(sum(vars_here)==1)

          objective=[]
          for (i,r),v in x.items():
              g=games[i]
              oh=ord_by_team_game[(g["homeTeam"]["id"],i)]
              oa=ord_by_team_game[(g["awayTeam"]["id"],i)]
              # Primary signal: where this match sits in both teams' chronological league schedules.
              cost=abs(r-oh)+abs(r-oa)
              objective.append(cost*v)
          model.Minimize(sum(objective))

          solver=cp_model.CpSolver()
          solver.parameters.max_time_in_seconds=90
          solver.parameters.num_search_workers=8
          status=solver.Solve(model)
          print("STATUS",solver.StatusName(status),"OBJECTIVE",solver.ObjectiveValue())
          if status not in (cp_model.OPTIMAL,cp_model.FEASIBLE):
              raise RuntimeError("No feasible round assignment")

          rounds=defaultdict(list)
          mapping=[]
          for i,g in enumerate(games):
              assigned=None
              for r in range(1,35):
                  if (i,r) in x and solver.Value(x[(i,r)]):
                      assigned=r
                      break
              assert assigned is not None
              rounds[assigned].append(g)
              mapping.append([g["id"],assigned])

          for r in range(1,35):
              b=rounds[r]
              ts=[]
              for g in b:
                  ts += [g["homeTeam"]["id"],g["awayTeam"]["id"]]
              assert len(b)==9 and len(set(ts))==18
              dates=sorted(g["date"][:10] for g in b)
              names=[f'{g["homeTeam"]["name"]} - {g["awayTeam"]["name"]}' for g in sorted(b,key=lambda z:z["date"])]
              print("ROUND",r,"DATES",dates,"MATCHES",names)

          mapping.sort(key=lambda p:(p[1],p[0]))
          print("MAPPING_JSON_BEGIN")
          print(json.dumps(mapping,separators=(",",":")))
          print("MAPPING_JSON_END")
          PY
