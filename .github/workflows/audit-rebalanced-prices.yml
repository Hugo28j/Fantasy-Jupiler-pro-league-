name: Audit rebalanced prices

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/audit-rebalanced-prices.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit projected player pool and rebalance
        shell: python
        run: |
          import json,re,urllib.parse,urllib.request,collections,math
          cfg=open("config.js","r",encoding="utf-8").read()
          url=re.search(r'supabaseUrl:\s*"([^"]+)"',cfg).group(1)
          key=re.search(r'supabaseAnonKey:\s*"([^"]+)"',cfg).group(1)

          def get(path,params,range_header="0-999"):
              qs=urllib.parse.urlencode(params,safe="(),*")
              req=urllib.request.Request(url+"/rest/v1/"+path+"?"+qs,headers={"apikey":key,"Accept":"application/json","Range":range_header})
              with urllib.request.urlopen(req,timeout=60) as r:
                  return json.loads(r.read().decode())

          players=get("players",{
            "select":"id,name,club_name,position,price,total_points,minutes,active",
            "order":"name.asc"
          })

          rows=[]
          start=0
          while True:
              page=get("player_match_stats",{
                "select":"player_id,minutes,fantasy_points,stats,fixtures(status,kickoff)"
              },f"{start}-{start+999}")
              rows.extend(page)
              if len(page)<1000: break
              start+=1000
              if start>10000: break

          agg=collections.defaultdict(lambda:[0.0,0.0])
          for r in rows:
              fx=r.get("fixtures") or {}
              if isinstance(fx,list): fx=fx[0] if fx else {}
              if fx.get("status")!="FT": continue
              agg[str(r["player_id"])][0]+=float(r.get("minutes") or 0)
              agg[str(r["player_id"])][1]+=float(r.get("fantasy_points") or 0)

          hidden=[]
          changed=[]
          projected=[]
          for p in players:
              mins,pts=agg[str(p["id"])]
              if p["position"]!="GK" and mins<=0:
                  hidden.append((p["name"],p["club_name"],p["position"]))
              hist=[r for r in rows if str(r["player_id"])==str(p["id"])]
              hist.sort(key=lambda r: str((r.get("fixtures") or {}).get("kickoff") or ""))
              orig=None
              for rr in hist:
                  raw=(rr.get("stats") or {}).get("marketBasePrice")
                  if raw is not None:
                      try:
                          orig=float(raw)
                          break
                      except:
                          pass
              if orig is None:
                  orig=float(p.get("price") or 1)
              if mins<=0:
                  target=orig
                  p90=None
              else:
                  p90=pts*90/mins
                  if p90<10: factor=.60
                  elif p90<20: factor=.75
                  elif p90<30: factor=.90
                  else: factor=1
                  perf=round(orig*factor*2)/2
                  if p90<30 and mins<90: cap=6
                  elif p90<30 and mins<180: cap=8
                  elif p90<30 and mins<270: cap=10
                  else: cap=999
                  target=max(1,min(orig,cap,perf))
              projected.append((p["name"],p["club_name"],p["position"],mins,round(pts,1),None if p90 is None else round(p90,1),orig,target))
              if target<orig-.01:
                  changed.append(projected[-1])

          print("PLAYER_COUNT",len(players))
          print("ZERO_MIN_OUTFIELD_REMOVED",len(hidden))
          print("REPRICED_PLAYERS",len(changed))
          print("HIDDEN_SAMPLE",json.dumps(hidden[:40],ensure_ascii=False))
          print("BIGGEST_DISCOUNTS",json.dumps(sorted(changed,key=lambda x:(x[7]-x[6]))[:40],ensure_ascii=False))
          buckets=collections.Counter()
          for x in projected:
              if x[0] in {h[0] for h in hidden}: continue
              t=x[7]
              if t<5:b="<5"
              elif t<10:b="5-10"
              elif t<15:b="10-15"
              elif t<20:b="15-20"
              else:b="20+"
              buckets[b]+=1
          print("PROJECTED_BASE_BUCKETS",json.dumps(buckets,ensure_ascii=False))
