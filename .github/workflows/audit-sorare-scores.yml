name: Audit Sorare scores

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/audit-sorare-scores.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recalculate gameweek 7 from Supabase public data
        shell: python
        run: |
          import json, re, urllib.request, urllib.parse, math

          cfg=open("config.js","r",encoding="utf-8").read()
          url=re.search(r'supabaseUrl:\s*"([^"]+)"',cfg).group(1)
          key=re.search(r'supabaseAnonKey:\s*"([^"]+)"',cfg).group(1)

          def get(path, params=None):
              qs=urllib.parse.urlencode(params or {}, doseq=True, safe="(),*")
              req=urllib.request.Request(
                  url + "/rest/v1/" + path + ("?" + qs if qs else ""),
                  headers={"apikey":key,"Accept":"application/json","Range":"0-9999"}
              )
              with urllib.request.urlopen(req,timeout=60) as r:
                  return json.loads(r.read().decode())

          gameweeks=get("gameweeks",{"select":"id,number","season":"eq.2026","number":"eq.7"})
          assert len(gameweeks)==1, f"Expected one gameweek 7, got {gameweeks}"
          gwid=gameweeks[0]["id"]

          fixtures=get("fixtures",{
              "select":"id,home_team,away_team,home_score,away_score,stats_processed",
              "gameweek_id":f"eq.{gwid}",
              "order":"kickoff.asc"
          })
          assert len(fixtures)==9, f"Expected 9 fixtures, got {len(fixtures)}"
          assert all(f["stats_processed"] for f in fixtures), "Not all fixtures are processed"

          players=get("players",{"select":"id,name,position","active":"eq.true","limit":"1000"})
          player_by_id={p["id"]:p for p in players}

          weights={
            "GK":{"minutes":.1,"save":3,"cleanSheet":20,"savesInsideBox":5,"punches":2,"goalsConceded":-5,"foulsMade":-1,"foulsDrawn":1,"yellow":-3,"red":-10,"goal":10,"assist":10,"successfulTackles":3,"duelWon":.5,"duelLost":-.5,"clearances":2,"interceptions":1,"possessionWon":.2,"possessionLost":-.2,"successfulPass":.1,"successfulLongPass":.3,"keyPass":.4,"passMissed":-.2,"successfulDribble":.2,"shotOnTarget":2},
            "DEF":{"minutes":.1,"goalsConceded":-5,"foulsMade":-1,"foulsDrawn":1,"yellow":-3,"red":-10,"goal":10,"assist":10,"successfulTackles":4,"duelWon":1,"duelLost":-1,"clearances":2,"interceptions":2,"possessionWon":.2,"possessionLost":-.2,"successfulPass":.1,"successfulLongPass":.3,"keyPass":.4,"passMissed":-.2,"successfulDribble":.2,"shotOnTarget":2},
            "MID":{"minutes":.1,"goalsConceded":-3,"foulsMade":-1,"foulsDrawn":1,"yellow":-3,"red":-10,"goal":10,"assist":10,"successfulTackles":3,"duelWon":.5,"duelLost":-.5,"clearances":1,"interceptions":2,"possessionWon":.3,"possessionLost":-.3,"successfulPass":.2,"successfulLongPass":.4,"keyPass":.6,"passMissed":-.3,"successfulDribble":.3,"shotOnTarget":2},
            "FWD":{"minutes":.1,"goalsConceded":-1,"foulsMade":-1,"foulsDrawn":1,"yellow":-3,"red":-10,"goal":10,"assist":10,"successfulTackles":2,"duelWon":1,"duelLost":-1,"clearances":1,"interceptions":1,"possessionWon":.2,"possessionLost":-.2,"successfulPass":.1,"successfulLongPass":.3,"keyPass":.6,"passMissed":-.1,"successfulDribble":.5,"shotOnTarget":4}
          }

          total_rows=0
          max_diff=0.0
          mismatches=[]
          fixture_counts={}
          samples=[]

          for f in fixtures:
              rows=get("player_match_stats",{
                  "select":"player_id,minutes,stats,fantasy_points",
                  "fixture_id":f"eq.{f['id']}",
                  "limit":"1000"
              })
              fixture_counts[f"{f['home_team']} - {f['away_team']}"]=len(rows)
              total_rows += len(rows)
              for row in rows:
                  player=player_by_id.get(row["player_id"])
                  if not player:
                      mismatches.append(("missing-player",row["player_id"]))
                      continue
                  stats=row.get("stats") or {}
                  calc=round(sum(float(stats.get(k,0) or 0)*w for k,w in weights[player["position"]].items())+1e-12,2)
                  stored=round(float(row["fantasy_points"] or 0),2)
                  diff=abs(calc-stored)
                  max_diff=max(max_diff,diff)
                  if diff>0.011:
                      mismatches.append((player["name"],player["position"],stored,calc,stats))
                  if len(samples)<6 and (stats.get("goal") or stats.get("assist") or stats.get("successfulTackles")):
                      samples.append({
                          "player":player["name"],
                          "position":player["position"],
                          "stored":stored,
                          "recalculated":calc,
                          "minutes":stats.get("minutes"),
                          "goals":stats.get("goal"),
                          "assists":stats.get("assist"),
                          "tacklesWon":stats.get("successfulTackles"),
                          "passes":stats.get("successfulPass")
                      })

          print("GAMEWEEK",7)
          print("FIXTURES",len(fixtures))
          print("PLAYER_MATCH_ROWS",total_rows)
          print("FIXTURE_COUNTS",json.dumps(fixture_counts,ensure_ascii=False))
          print("MAX_SCORE_DIFF",max_diff)
          print("MISMATCH_COUNT",len(mismatches))
          print("SAMPLES",json.dumps(samples,ensure_ascii=False,indent=2))
          if mismatches:
              print("FIRST_MISMATCHES",json.dumps(mismatches[:10],ensure_ascii=False,indent=2))
              raise SystemExit(1)
          assert total_rows==552, f"Expected 552 imported rows, got {total_rows}"
          assert min(fixture_counts.values())>=18, f"Incomplete fixture rows: {fixture_counts}"
          print("AUDIT_OK")
