name: Test TheSportsDB free API

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-thesportsdb.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Belgian Pro League 2026-27
        shell: python
        run: |
          import json
          import urllib.request
          import urllib.error

          BASE = "https://www.thesportsdb.com/api/v1/json/123"

          def get(name, path):
              url = BASE + path
              print(f"\n=== {name} ===")
              print(url)
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Fantasy-JPL/1.0"})
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read().decode("utf-8")
                      print("HTTP", response.status)
                  data = json.loads(raw)
              except Exception as exc:
                  print("ERROR", repr(exc))
                  return None
              print("TOP_LEVEL_KEYS", list(data.keys()) if isinstance(data, dict) else type(data).__name__)
              return data

          season = get("SEASON", "/eventsseason.php?id=4338&s=2026-2027")
          events = (season or {}).get("events") or []
          print("EVENT_COUNT", len(events))
          for event in events:
              print("EVENT", {
                  "idEvent": event.get("idEvent"),
                  "intRound": event.get("intRound"),
                  "strHomeTeam": event.get("strHomeTeam"),
                  "strAwayTeam": event.get("strAwayTeam"),
                  "intHomeScore": event.get("intHomeScore"),
                  "intAwayScore": event.get("intAwayScore"),
                  "strTimestamp": event.get("strTimestamp"),
                  "strStatus": event.get("strStatus"),
              })

          event_id = "2496726"
          lineup = get("LINEUP", f"/lookuplineup.php?id={event_id}")
          lineup_rows = (lineup or {}).get("lineup") or []
          print("LINEUP_COUNT", len(lineup_rows))
          if lineup_rows:
              print("LINEUP_KEYS", sorted(lineup_rows[0].keys()))
              print("LINEUP_SAMPLE", lineup_rows[:5])

          timeline = get("TIMELINE", f"/lookuptimeline.php?id={event_id}")
          timeline_rows = (timeline or {}).get("timeline") or []
          print("TIMELINE_COUNT", len(timeline_rows))
          if timeline_rows:
              print("TIMELINE_KEYS", sorted(timeline_rows[0].keys()))
              print("TIMELINE_SAMPLE", timeline_rows[:5])

          stats = get("EVENT_STATS", f"/lookupeventstats.php?id={event_id}")
          stats_rows = (stats or {}).get("eventstats") or []
          print("EVENT_STATS_COUNT", len(stats_rows))
          if stats_rows:
              print("EVENT_STATS_KEYS", sorted(stats_rows[0].keys()))
              print("EVENT_STATS_SAMPLE", stats_rows[:10])

          if events:
              team_id = events[0].get("idHomeTeam")
              if team_id:
                  players = get("TEAM_PLAYERS", f"/lookup_all_players.php?id={team_id}")
                  player_rows = (players or {}).get("player") or []
                  print("TEAM_PLAYER_COUNT", len(player_rows))
                  if player_rows:
                      print("TEAM_PLAYER_KEYS", sorted(player_rows[0].keys()))
                      print("TEAM_PLAYER_SAMPLE", [
                          {
                              "idPlayer": p.get("idPlayer"),
                              "strPlayer": p.get("strPlayer"),
                              "strPosition": p.get("strPosition"),
                              "idTeam": p.get("idTeam"),
                              "strTeam": p.get("strTeam"),
                          } for p in player_rows[:10]
                      ])
                      player_id = player_rows[0].get("idPlayer")
                      if player_id:
                          pstats = get("PLAYER_STATS", f"/lookupplayerstats.php?id={player_id}")
                          stat_rows = (pstats or {}).get("playerstats") or (pstats or {}).get("statistics") or []
                          print("PLAYER_STATS_COUNT", len(stat_rows))
                          if stat_rows:
                              print("PLAYER_STATS_KEYS", sorted(stat_rows[0].keys()))
                              print("PLAYER_STATS_SAMPLE", stat_rows[:3])
